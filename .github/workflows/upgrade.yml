name: Upgrade Arize

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Version to upgrade to, for example 11.43.0"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: arize-upgrade
  cancel-in-progress: false

env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  NOTIFY_PROVIDER: ${{ vars.NOTIFY_PROVIDER }}
  PUSH_REGISTRY: ${{ vars.PUSH_REGISTRY }}
  APP_BASE_URL: ${{ vars.APP_BASE_URL }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:
  announce:
    name: Announce the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      thread_ref: ${{ steps.notify.outputs.thread_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet -e .
      - name: Post the approval request
        id: notify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYED_VERSION: ${{ vars.DEPLOYED_VERSION }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          arize-upgrade notify \
            --stage detected \
            --target "${TARGET_VERSION}"

  push-images:
    name: Pull and push images to ECR
    needs: announce
    runs-on: ubuntu-latest
    environment: image-push
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet -e .

      - name: Prepare runner disk
        run: ./scripts/prepare-runner-disk.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${PUSH_REGISTRY}"

      - name: Download the distribution
        env:
          JWT: ${{ secrets.ARIZE_HUB_JWT_RAW }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          # Integrity check on this script is vendor-imposed: bundle.py verifies
          # the resulting bundle's version, but nothing here verifies the bytes
          # served by get_latest.sh. That is a known, accepted limitation.
          curl -sSf -H "Authorization: Bearer ${JWT}" \
            "https://ch.hub.arize.com/dist/get_latest.sh" | sh -

      - name: Verify the bundle is the approved version
        id: bundle
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          arize-upgrade verify-bundle \
            --dir dist \
            --expect "${TARGET_VERSION}"

      - name: Render values.yaml
        env:
          # Credentials -> environment Secrets
          ARIZE_HUB_JWT: ${{ secrets.ARIZE_HUB_JWT }}
          ARIZE_CIPHER_KEY: ${{ secrets.ARIZE_CIPHER_KEY }}
          ARIZE_POSTGRES_PASSWORD: ${{ secrets.ARIZE_POSTGRES_PASSWORD }}
          ARIZE_SMTP_USER: ${{ secrets.ARIZE_SMTP_USER }}
          ARIZE_SMTP_PASSWORD: ${{ secrets.ARIZE_SMTP_PASSWORD }}
          ARIZE_GCP_SA_KEY: ${{ secrets.ARIZE_GCP_SA_KEY }}
          ARIZE_INTERNAL_TLS_CERT: ${{ secrets.ARIZE_INTERNAL_TLS_CERT }}
          ARIZE_INTERNAL_TLS_KEY: ${{ secrets.ARIZE_INTERNAL_TLS_KEY }}
          ARIZE_FLIGHT_TLS_CERT: ${{ secrets.ARIZE_FLIGHT_TLS_CERT }}
          ARIZE_FLIGHT_TLS_KEY: ${{ secrets.ARIZE_FLIGHT_TLS_KEY }}
          # Non-secret config -> repository Variables. render-values.sh fails
          # closed and names any that are missing, so all REQUIRED ones appear
          # here even though several duplicate workflow-level variables.
          ARIZE_CLUSTER_ARN: ${{ vars.ARIZE_CLUSTER_ARN }}
          ARIZE_REGION: ${{ vars.ARIZE_REGION }}
          ARIZE_GAZETTE_BUCKET: ${{ vars.ARIZE_GAZETTE_BUCKET }}
          ARIZE_DRUID_BUCKET: ${{ vars.ARIZE_DRUID_BUCKET }}
          ARIZE_ORGANIZATION_NAME: ${{ vars.ARIZE_ORGANIZATION_NAME }}
          ARIZE_APP_BASE_URL: ${{ vars.ARIZE_APP_BASE_URL }}
          ARIZE_EXP_BASE_URL: ${{ vars.ARIZE_EXP_BASE_URL }}
          ARIZE_RW_BUCKET_ROLE_ARN: ${{ vars.ARIZE_RW_BUCKET_ROLE_ARN }}
          ARIZE_PUSH_REGISTRY: ${{ vars.ARIZE_PUSH_REGISTRY }}
          ARIZE_GCP_PROJECT: ${{ vars.ARIZE_GCP_PROJECT }}
          ARIZE_SMTP_HOST: ${{ vars.ARIZE_SMTP_HOST }}
          ARIZE_SMTP_SENDER_EMAIL: ${{ vars.ARIZE_SMTP_SENDER_EMAIL }}
          # Optional tunables: unset here on purpose. render-values.sh applies
          # its documented defaults and logs which ones it applied. Set the
          # matching repository Variable to override any of them.
        run: ./scripts/render-values.sh "${{ steps.bundle.outputs.bundle_dir }}/values.yaml"

      - name: Pull images from the Arize registry
        working-directory: ${{ steps.bundle.outputs.bundle_dir }}
        run: ./arize.sh -y -q pull-images

      - name: Push images to ECR
        working-directory: ${{ steps.bundle.outputs.bundle_dir }}
        run: ./arize.sh -y -q push-images

      - name: Clean up
        if: always()
        run: |
          set -euo pipefail
          rm -f dist/*/values.yaml
          docker image prune -af || true
          df -h /mnt

  announce-images:
    name: Request install approval
    needs: [announce, push-images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet -e .
      - name: Post the second approval request
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          arize-upgrade notify \
            --stage images \
            --target "${TARGET_VERSION}" \
            --reply-to "${{ needs.announce.outputs.thread_ref }}"

  install:
    name: Install on the cluster
    needs: [announce, push-images, announce-images]
    runs-on: ubuntu-latest
    environment: cluster-install
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet -e .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Point kubectl at the cluster
        env:
          ARIZE_CLUSTER_ARN: ${{ vars.ARIZE_CLUSTER_ARN }}
        run: |
          set -euo pipefail
          # arize.sh runs `kubectl --cluster=$clusterName` where clusterName is the
          # ARN rendered into values.yaml. Derive the ARN from AWS rather than
          # trusting a second variable, so the two cannot silently disagree.
          actual_arn=$(aws eks describe-cluster --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}" --query 'cluster.arn' --output text)
          if [ "${actual_arn}" != "${ARIZE_CLUSTER_ARN}" ]; then
            echo "::error::EKS_CLUSTER_NAME=${EKS_CLUSTER_NAME} resolves to ${actual_arn}, but values.yaml will target ${ARIZE_CLUSTER_ARN}" >&2
            exit 1
          fi
          aws eks update-kubeconfig --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}" --alias "${actual_arn}"
          # Prove the aliased entry reaches a real API server. get-contexts is a
          # purely local read and would pass against a kubeconfig pointing nowhere.
          kubectl --cluster="${actual_arn}" version --request-timeout=30s

      - name: Download the distribution
        env:
          JWT: ${{ secrets.ARIZE_HUB_JWT_RAW }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          # Integrity check on this script is vendor-imposed: bundle.py verifies
          # the resulting bundle's version, but nothing here verifies the bytes
          # served by get_latest.sh. That is a known, accepted limitation.
          curl -sSf -H "Authorization: Bearer ${JWT}" \
            "https://ch.hub.arize.com/dist/get_latest.sh" | sh -

      - name: Verify the bundle is the approved version
        id: bundle
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          arize-upgrade verify-bundle \
            --dir dist \
            --expect "${TARGET_VERSION}"

      - name: Render values.yaml
        env:
          # Credentials -> environment Secrets
          ARIZE_HUB_JWT: ${{ secrets.ARIZE_HUB_JWT }}
          ARIZE_CIPHER_KEY: ${{ secrets.ARIZE_CIPHER_KEY }}
          ARIZE_POSTGRES_PASSWORD: ${{ secrets.ARIZE_POSTGRES_PASSWORD }}
          ARIZE_SMTP_USER: ${{ secrets.ARIZE_SMTP_USER }}
          ARIZE_SMTP_PASSWORD: ${{ secrets.ARIZE_SMTP_PASSWORD }}
          ARIZE_GCP_SA_KEY: ${{ secrets.ARIZE_GCP_SA_KEY }}
          ARIZE_INTERNAL_TLS_CERT: ${{ secrets.ARIZE_INTERNAL_TLS_CERT }}
          ARIZE_INTERNAL_TLS_KEY: ${{ secrets.ARIZE_INTERNAL_TLS_KEY }}
          ARIZE_FLIGHT_TLS_CERT: ${{ secrets.ARIZE_FLIGHT_TLS_CERT }}
          ARIZE_FLIGHT_TLS_KEY: ${{ secrets.ARIZE_FLIGHT_TLS_KEY }}
          # Non-secret config -> repository Variables. render-values.sh fails
          # closed and names any that are missing, so all REQUIRED ones appear
          # here even though several duplicate workflow-level variables.
          ARIZE_CLUSTER_ARN: ${{ vars.ARIZE_CLUSTER_ARN }}
          ARIZE_REGION: ${{ vars.ARIZE_REGION }}
          ARIZE_GAZETTE_BUCKET: ${{ vars.ARIZE_GAZETTE_BUCKET }}
          ARIZE_DRUID_BUCKET: ${{ vars.ARIZE_DRUID_BUCKET }}
          ARIZE_ORGANIZATION_NAME: ${{ vars.ARIZE_ORGANIZATION_NAME }}
          ARIZE_APP_BASE_URL: ${{ vars.ARIZE_APP_BASE_URL }}
          ARIZE_EXP_BASE_URL: ${{ vars.ARIZE_EXP_BASE_URL }}
          ARIZE_RW_BUCKET_ROLE_ARN: ${{ vars.ARIZE_RW_BUCKET_ROLE_ARN }}
          ARIZE_PUSH_REGISTRY: ${{ vars.ARIZE_PUSH_REGISTRY }}
          ARIZE_GCP_PROJECT: ${{ vars.ARIZE_GCP_PROJECT }}
          ARIZE_SMTP_HOST: ${{ vars.ARIZE_SMTP_HOST }}
          ARIZE_SMTP_SENDER_EMAIL: ${{ vars.ARIZE_SMTP_SENDER_EMAIL }}
          # Optional tunables: unset here on purpose. render-values.sh applies
          # its documented defaults and logs which ones it applied. Set the
          # matching repository Variable to override any of them.
        run: ./scripts/render-values.sh "${{ steps.bundle.outputs.bundle_dir }}/values.yaml"

      - name: Install
        working-directory: ${{ steps.bundle.outputs.bundle_dir }}
        run: ./arize.sh -y -q -t 3600 install

      - name: Wait for the cluster to report healthy
        working-directory: ${{ steps.bundle.outputs.bundle_dir }}
        run: ./arize.sh -y -q -t 1800 install-status

      - name: Clean up
        if: always()
        run: rm -f dist/*/values.yaml

  record:
    name: Report the outcome
    needs: [announce, push-images, announce-images, install]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet -e .

      - name: Determine the outcome
        id: outcome
        run: |
          set -euo pipefail
          case "${{ needs.install.result }}" in
            success)  echo "value=success" >> "$GITHUB_OUTPUT"
                      echo "attempted=true"  >> "$GITHUB_OUTPUT" ;;
            skipped|cancelled)
                      echo "value=failure" >> "$GITHUB_OUTPUT"
                      echo "attempted=false" >> "$GITHUB_OUTPUT" ;;
            *)        echo "value=failure" >> "$GITHUB_OUTPUT"
                      echo "attempted=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Post the result
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          arize-upgrade notify \
            --stage result \
            --target "${TARGET_VERSION}" \
            --outcome "${{ steps.outcome.outputs.value }}" \
            --reply-to "${{ needs.announce.outputs.thread_ref }}"

      - name: Record the deployment
        if: ${{ !cancelled() && steps.outcome.outputs.value == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          arize-upgrade record --version "${TARGET_VERSION}"

      - name: Open a failure issue
        if: ${{ !cancelled() && steps.outcome.outputs.value == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.target_version }}
          ATTEMPTED: ${{ steps.outcome.outputs.attempted }}
        run: |
          set -euo pipefail
          if [ "${ATTEMPTED}" = "false" ]; then
            body=$(cat <<EOF
          The upgrade to \`${TARGET}\` did not start: the install job was skipped
          or cancelled (a reviewer may have declined the approval gate, the
          approval timed out, or an upstream job failed). The cluster was not
          contacted and was not modified.

          - Run: ${RUN_URL}
          - Image push: ${{ needs['push-images'].result }}
          - Request install approval: ${{ needs['announce-images'].result }}
          - Install: ${{ needs.install.result }}

          Review the run logs to see why the install did not proceed.
          EOF
          )
          else
            body=$(cat <<EOF
          The upgrade to \`${TARGET}\` did not complete.

          - Run: ${RUN_URL}
          - Image push: ${{ needs['push-images'].result }}
          - Request install approval: ${{ needs['announce-images'].result }}
          - Install: ${{ needs.install.result }}

          There is no automatic rollback. The cluster may be partially upgraded.
          Review the run logs before retrying.
          EOF
          )
          fi
          issue_url=$(gh issue create \
            --title "Arize upgrade to ${TARGET} failed" \
            --body "${body}")
          gh issue edit "${issue_url}" --add-label arize-upgrade || true
